name = "cryax-api"
main = "src/worker.js"
compatibility_date = "2026-01-15"
workers_dev = true

[vars]
API_SECRET = "cryaxontop"

[build]
command = "node build.mjs"

[[durable_objects.bindings]]
name = "STORE"
class_name = "CryaxStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CryaxStore"]
